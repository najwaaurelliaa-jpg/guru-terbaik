<!DOCTYPE html>  
<html lang="en">      
<head>    
    <meta charset="UTF-8" />    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />    
    <title>Mathience.49</title>    
    <script src="https://cdn.tailwindcss.com"></script>    
    <link    
      rel="stylesheet"    
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"    
    />

    <!-- ==== PAKSA ANIMASI TETAP HIDUP MESKI IPHONE REDUCE MOTION AKTIF ==== -->
    <style>
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 5.0s !important;
          animation-play-state: running !important;
          transition: all 1.0s !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
</head>   

<body    
    style="    
      background-image: url(https://i.ibb.co.com/hRJDsfz8/baru-Whats-App-2025-11-15-pukul-13-12-59-c90a22d3.jpg);    
      background-size: cover; 
      background-position: center;

    "    
    class="flex justify-center h-screen items-center"    
>    

    <!-- MUSIK (DITAMBAHKAN) -->
    <audio id="musik" src="pagikucerahku.mp3.mp3"></audio>

    <div    
      class="bg-white border px-10 py-8 border-4 border-gray-300 shadow-lg shadow-blue-300 rounded-xl text-center animate__animated animate__backInDown m-8 w-80"    
      id="kartu"    
    >    
      <h1 class="text-3xl font-semibold">🎉HELLO💐</h1>  
      <h1 class="text-3xl text-blue-900 font-semibold mt-1">WELCOME!</h1>  

      <button  
        class="p-2 bg-blue-800 text-white rounded mt-5 hover:bg-blue-900 transition ease-in w-full"  
        onclick="nextPage()"  
      >  
        Click Here! 
      </button>  
    </div>   

<script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>  
<script>  

  const musik = document.getElementById("musik");   // DITAMBAHKAN
  const kartu = document.getElementById("kartu");  

  window.onload = () => {
      kartu.style.animationDuration = "3.5s"
        
        kartu.style.opacity = 1;
        kartu.addEventListener("animationend", () => {
          kartu.classList.remove("animate__animated", "animate__fadeInDown");
        });
      };


  let halaman = 0;  
  const ucapan = [  
    { teks: "sebenernya mau tes aja.", tombol: "Next" },  
    { teks: "Jadi pokoknya ini web mau tak buat untuk orng, tapi ak mau tes dulu", tombol: "Next" },  
    { teks: "Terimakasih sudah membantu, btw selamat karena sudah melewati forcis", tombol: "Next" },

  ];  

  function nextPage() {

    // === MUSIK MULAI KETIKA HALAMAN PERTAMA DIBUKA ===
    if (halaman === 0) {
      musik.play();
    }

    // Animasi fade out
    kartu.classList.add("animate__animated", "animate__pulse");
    
    setTimeout(() => {
      halaman++;

      kartu.classList.remove("animate__pulse");

      if (halaman <= ucapan.length) {
        confetti({ particleCount: 80, spread: 70, angel: 90, origin: { y: 0.2 } });

        if (halaman < ucapan.length) {
          kartu.innerHTML = `
            <h1 class="text-x font-semi animate__animated animate__pulse">${ucapan[halaman - 1].teks}</h1>
            <button class="p-2 bg-blue-600 text-white rounded mt-5 hover:bg-blue-900 transition ease-in w-full animate_animated animatetada animate_delay-1s" onclick="nextPage()">
              ${ucapan[halaman - 1].tombol}
            </button>`;
        } else {
          kartu.innerHTML = `
            <h1 class="text-x font-semi animate__animated animate__pulse">${ucapan[halaman - 1].teks}</h1>
            <button class="p-2 bg-blue-700 text-white rounded mt-5 hover:bg-gray-900 transition ease-in w-full animate__animated animatetada animate__delay-1s" onclick="refresh()">
              Tutup
            </button>`;
        }
      }
    }, 400);
  }

  function refresh() {

    // === MATIKAN MUSIK KETIKA TOMBOL TUTUP DI TEKAN ===
    musik.pause();
    musik.currentTime = 0;

    location.reload();
  }

</script>

</body>
</html>
